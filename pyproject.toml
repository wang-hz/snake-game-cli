[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "snake-game-cli"
dynamic = ["version"]
authors = [
  { name="Wang H.Z.", email="imwanghz@gmail.com" },
]
description = "Play snake game in your terminal."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
  "windows-curses; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/wang-hz/snake-game-cli"

[project.scripts]
play-snake = "snake_game_cli:main"

[tool.hatch.version]
source = "vcs"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
